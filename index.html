<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Registro de Incidencias</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <div class="header-content">
        <h1>🛠️ Sistema de Registro de Incidencias</h1>
        <span class="version-badge" id="appVersion">v1.0.0</span>
      </div>
      <p class="subtitle">Gestión de la Configuración del Software — Despliegue Continuo</p>
    </header>

    <main>
      <!-- Formulario para ingresar nuevas incidencias -->
      <section class="card form-section">
        <h2>Reportar Nueva Incidencia</h2>
        <form id="issueForm">
          <div class="form-group">
            <label for="title">Título de la incidencia:</label>
            <input 
              type="text" 
              id="title" 
              name="title" 
              placeholder="Ej. Error 500 al procesar pago" 
              required
            >
          </div>

          <div class="form-group">
            <label for="description">Descripción detallada:</label>
            <textarea 
              id="description" 
              name="description" 
              rows="3" 
              placeholder="Describa el comportamiento observado y los pasos para reproducirlo..." 
              required
            ></textarea>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="priority">Prioridad:</label>
              <select id="priority" name="priority">
                <option value="Baja">Baja</option>
                <option value="Media" selected>Media</option>
                <option value="Alta">Alta</option>
              </select>
            </div>

            <div class="form-group">
              <label for="status">Estado Inicial:</label>
              <select id="status" name="status">
                <option value="Abierta" selected>Abierta</option>
                <option value="En progreso">En progreso</option>
                <option value="Resuelta">Resuelta</option>
              </select>
            </div>
          </div>

          <button type="submit" class="btn btn-primary" id="btnSubmit">Registrar Incidencia</button>
        </form>
      </section>

      <!-- Listado de incidencias registradas -->
      <section class="card list-section">
        <div class="list-header">
          <h2>Incidencias Registradas</h2>
          <span class="counter" id="totalCount">Total: 0</span>
        </div>

        <div id="issuesContainer" class="issues-list">
          <!-- Las incidencias se cargan dinámicamente mediante JavaScript -->
        </div>
      </section>
    </main>

    <footer>
      <p>Gestión de la Configuración del Software — Equipo de Desarrollo (Darly, Francisco, Danilo, Gabriel, Hernan)</p>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
